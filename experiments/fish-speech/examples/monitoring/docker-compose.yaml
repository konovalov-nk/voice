# Prometheus + Grafana for Fish Speech API metrics.
# From repo root: docker compose -f examples/monitoring/docker-compose.yaml -p fish-monitoring up -d
# API server must be running (e.g. make run-server) and expose http://127.0.0.1:8080/metrics
# Grafana: http://localhost:3000  (admin/admin). Prometheus: http://localhost:9090

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: fish-prometheus
    network_mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    container_name: fish-grafana
    network_mode: host
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards/config:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards/json:/var/lib/grafana/dashboards
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_BASIC_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_UID=fish-speech
    depends_on:
      - prometheus
